name: Публикация на GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BASE_PATH: /${{ github.event.repository.name }}/
    steps:
      - name: Получить исходный код
        uses: actions/checkout@v6

      - name: Настроить Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Установить зависимости
        run: npm ci

      - name: Собрать приложение
        run: npm run build

      - name: Настроить GitHub Pages
        uses: actions/configure-pages@v5

      - name: Загрузить артефакт GitHub Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: app/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Развернуть GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
